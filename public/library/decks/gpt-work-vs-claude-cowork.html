<script>
const SRC={gptModels:'https://openai.com/index/introducing-gpt-6-sol-and-luna/',openaiModels:'https://help.openai.com/en/articles/20001354-gpt-56-and-gpt-6-pro-in-chatgpt',claudeModels:'https://platform.claude.com/docs/en/models/overview',claudeChoosing:'https://platform.claude.com/docs/en/about-claude/models/choosing-a-model',openai:'https://help.openai.com/en/articles/20001275-chatgpt-work-and-codex',projects:'https://help.openai.com/en/articles/10169521-using-projects-in-chatgpt',work:'https://openai.com/chatgpt-work/',cowork:'https://support.claude.com/en/articles/13455879-use-claude-cowork-on-team-and-enterprise-plans',claudeProjects:'https://support.claude.com/en/articles/14116274-organize-your-tasks-with-projects-in-claude-cowork'};
const cite=(...keys)=>`<p class="source-inline">Sources: ${keys.map(k=>`<a href="${SRC[k]}" target="_blank" rel="noopener">${({openai:'OpenAI: Work and Codex',projects:'OpenAI: Projects',work:'OpenAI: GPT Work',cowork:'Anthropic: Cowork on Team and Enterprise',claudeProjects:'Anthropic: Cowork projects',gptModels:'OpenAI: GPT-6 Sol and Luna',openaiModels:'OpenAI: GPT models in ChatGPT',claudeModels:'Anthropic: Claude model overview',claudeChoosing:'Anthropic: model selection guide'})[k]}</a>`).join(' · ')}</p>`;
const cards=(items,cls='g3')=>`<div class="grid ${cls}">${items.map((x,i)=>`<article class="card ${x[2]||''}"><div class="num">${String(i+1).padStart(2,'0')}</div><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div>`;
const bullets=items=>`<div class="bullets">${items.map((x,i)=>`<div class="bullet"><span class="n">${String(i+1).padStart(2,'0')}</span><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`;
const slides=[
{section:'FIELD GUIDE',title:'Choosing the right AI for the work.',body:`<p class="lead">GPT Work and Claude Cowork Comparison.</p><div class="cover-grid"><div class="cover-panel cover-gpt"><span class="cover-label">OPENAI</span><strong>GPT<br>WORK</strong><small>Connect context. Move work forward.</small></div><div class="cover-panel cover-claude"><span class="cover-label">ANTHROPIC</span><strong>CLAUDE<br>COWORK</strong><small>Work through files. Share project context.</small></div></div><p class="slide-note">A practical field guide for Breville teams · Updated 23 September 2026</p>`,type:'title'},
{section:'Start here',title:'The 30-second version',body:`${cards([['Both do the legwork','Give either assistant a task, relevant context and permission to work. It can research, analyse and make a usable file.','accent'],['Both have team projects','People can share project context on eligible plans. Claude Cowork now supports shared projects on Team and Enterprise.','teal'],['The Work caveat','ChatGPT shared projects use project-only memory. OpenAI currently says Work cannot run inside those projects.','amber']])}${cite('openai','projects','claudeProjects')}`},
{section:'Start here',title:'Why use an agent at work?',body:`<p class="lead">It can take a job from messy inputs to a reviewable output, across several steps.</p>${cards([['Less assembly','Turn notes, documents and data into a brief, spreadsheet or slides.'],['Faster first pass','Ask it to find inconsistencies and draft a version the team can review.'],['Repeat the routine','Re-run a defined workflow with fresh inputs, where the product and your workspace permit it.']])}<p class="slide-note">You still own the source checks, approvals and final decisions.</p>${cite('work','cowork')}`},
{section:'Start here',title:'Three Breville-sized examples',body:`${cards([['Product launch brief','Give it approved product facts, research and a brief template. Ask for launch claims with source links and a list of gaps.','accent'],['Test kitchen synthesis','Group recipe test notes by appliance and failure mode. Produce questions for the next round of testing.','teal'],['Weekly AI clinic recap','Turn session notes into themes, follow-ups and an internal FAQ draft. Have the owner review before sharing.','amber']])}<p class="slide-note">These are suggested pilot tasks, not claims that Breville has deployed them.</p>`},
{section:'Start here',title:'What actually differs?',body:`<table class="matrix"><thead><tr><th>Question</th><th>GPT Work</th><th>Claude Cowork</th></tr></thead><tbody><tr><td>Core job</td><td>Multi-step research, analysis and finished deliverables</td><td>Multi-step work across files, apps and browser</td></tr><tr><td>Shared project?</td><td>ChatGPT projects can be shared</td><td>Cowork projects can be shared on Team and Enterprise</td></tr><tr><td>Agent in shared project?</td><td>OpenAI docs say Work is unavailable in project-only projects, including shared ones</td><td>Anthropic documents sharing Cowork projects</td></tr><tr><td>Local files?</td><td>Desktop Work with permission; web/mobile cannot directly access your computer</td><td>Desktop local sessions; local-folder projects stay on that computer</td></tr></tbody></table>${cite('openai','projects','cowork','claudeProjects')}`},
{section:'Start here',title:'A useful correction to previous deck',body:`<span class="tag warm">PRODUCT UPDATES</span><h2>“Cowork cannot be used with team members” is out of date.</h2><p class="lead">Anthropic now documents shared Cowork projects for Team and Enterprise, with view or edit access. The older deck’s statement about unshareable sessions still matters: a shared project is not the same thing as jointly editing one live session.</p>${cite('claudeProjects','projects')}`},
{section:'Deep dive',title:'How the tools work',body:`<p class="lead">Where work runs, what context it sees, and what team members can actually share.</p>`,type:'section'},
{section:'Deep dive',title:'Chat, Work and Codex',body:`${cards([['Chat','Fast questions, drafting and everyday conversations.'],['Work','Longer, multi-step tasks: research, documents, analysis, presentations and Sites.','accent'],['Codex','Software development: repositories, commands, tests and code reviews.']])}<p class="slide-note">On desktop, choose Chat or Work inside ChatGPT. Codex has its own view. Work also appears on eligible web and mobile plans.</p>${cite('openai')}`},
{section:'Deep dive',title:'What can Work use?',body:`${bullets([['Project context','From a project, Work can start a task using its context, subject to the project’s memory configuration.'],['Your computer','Desktop Work can open local folders and use desktop apps after you grant access. Local files are not directly available to web or mobile Work.'],['Connected sources','Supported apps and plugins can supply context or help take action, subject to access and approvals.'],['Deliverables','Work can produce documents, spreadsheets, presentations, analyses and shareable Sites.']])}${cite('openai','work','projects')}`},
{section:'Deep dive',title:'What can Cowork use?',body:`${bullets([['Local or cloud sessions','Local sessions run on a person’s computer. Cloud sessions can continue across devices where enabled.'],['Project context','A project can hold files, links, instructions, memory and scheduled tasks.'],['Shared projects','Team and Enterprise members can share a Cowork project with view or edit access.'],['Local-folder limit','A project created from a folder on one computer stays on that computer.']])}${cite('cowork','claudeProjects')}`},
{section:'Deep dive',title:'At a glance: Work and Cowork side by side',body:`<p class="lead">Same broad goal: finish a multi-step job. The team workflow is where the clearest difference sits.</p><table class="matrix comparison"><thead><tr><th>In everyday terms</th><th>GPT Work</th><th>Claude Cowork</th></tr></thead><tbody><tr><td>Good for</td><td>Research, analysis and finished work across ChatGPT tools, apps and files.</td><td>Delegated work with selected files, folders and project context.</td></tr><tr><td>Can the team share a project?</td><td>Yes, ChatGPT projects can be shared.</td><td>Yes, Cowork project sharing is documented for Team and Enterprise.</td></tr><tr><td>Can Work/Cowork run from that shared project?</td><td>Work is currently unavailable in shared projects, which use project-only memory.</td><td>Yes, members can share and work from Cowork projects, subject to permissions.</td></tr><tr><td>Best fit when…</td><td>You need Work for a solo multi-step run, then share the checked output with colleagues.</td><td>The team needs a shared agent workspace with the same files and instructions.</td></tr></tbody></table><p class="slide-note">Quick choice: shared agent project → Cowork. Individual Work run and shared output → GPT Work. Confirm access in your own workspace.</p>${cite('openai','projects','claudeProjects','cowork')}`},
{section:'Deep dive',title:'What does “sharing” mean here?',body:`<p class="lead">Yes, these ideas apply to both tools. The products support them in different ways.</p><table class="matrix"><thead><tr><th>What people share</th><th>Plain English example</th><th>Work and Cowork today</th></tr></thead><tbody><tr><td>Project context</td><td>One place for the team’s files, instructions and project chats.</td><td>Both offer shared projects. Claude documents shared Cowork projects on Team and Enterprise.</td></tr><tr><td>Agent run</td><td>One person asks the agent to do the job using that context.</td><td>Cowork projects can be shared. GPT Work is currently unavailable inside shared, project-only projects.</td></tr><tr><td>Finished result</td><td>The brief, spreadsheet or deck the team can review and use.</td><td>Either tool can create a result you then share with colleagues.</td></tr><tr><td>Reusable recipe</td><td>A prompt, checklist or template another person can copy.</td><td>People can reuse the instructions, but each still needs their own access and permissions.</td></tr></tbody></table><p class="slide-note"><strong>Key point:</strong> “Shared project” means shared context. It does not automatically mean everyone can run every agent mode inside it.</p>${cite('projects','claudeProjects','openai')}`},
{section:'Deep dive',title:'One weekly brief, two team setups',body:`<p class="lead">Example: a product team wants an agent to draft the same weekly launch brief from shared notes.</p>${cards([['ChatGPT shared project','The team keeps its brief template and notes together. Members can use Chat in that project. Work itself is currently unavailable there because shared projects use project-only memory. One person can run Work in an eligible private context, then share the reviewed draft back.','accent'],['Claude Cowork shared project','On Enterprise, invite colleagues to a Cowork project with view or edit access. Members share its project context and can work from it. A project tied to a local computer folder still stays on that computer.','teal']],'g2')}${cite('projects','claudeProjects','cowork')}`},
{section:'Deep dive',title:'Where the team benefit still sits',body:`${cards([['Shared context','Teams can collect agreed facts, briefs and decisions in one ChatGPT project, using Chat for work inside it.','accent'],['Individual Work runs','A member can run Work in an eligible private project or separate task, then review and share the output.','teal'],['Reusable assets','Publish a reviewed file or Site for colleagues to use. A shared scheduled task can be copied where available.','amber']])}<p class="slide-note">This is a proposed operating pattern, not a workaround that grants Work inside a shared project.</p>${cite('projects','openai','work')}`},
{section:'Deep dive',title:'Choosing a first tool',body:`<table class="matrix"><thead><tr><th>Situation</th><th>Good starting point</th><th>Why</th></tr></thead><tbody><tr><td>One person needs a polished analysis or deck</td><td>GPT Work or Cowork</td><td>Pick by source access, approved tenant and preferred output</td></tr><tr><td>Several people need the same evolving agent project</td><td>Evaluate Cowork shared projects</td><td>Anthropic documents shared Cowork projects on Team and Enterprise</td></tr><tr><td>Several people need a shared knowledge hub</td><td>Either platform’s shared projects</td><td>Use shared files and instructions; test which agent features work there</td></tr><tr><td>Developer needs code changes</td><td>Codex or Claude Code</td><td>Use a tool designed for repositories and tests</td></tr></tbody></table>${cite('openai','projects','claudeProjects')}`},
{section:'Deep dive',title:'Controls to decide before the pilot',body:`${cards([['Who can open it?','Use a named owner and specific members. Give edit access only to people who maintain project context.'],['What can it read?','Start with a curated, low-risk source set. Keep source permissions and connected-app access narrow.'],['Who approves changes?','Require a human review of external messages, product claims and changes to source files.']])}<p class="slide-note">Product settings and access may vary by Breville workspace policy. Check the tenant before training staff.</p>${cite('projects','openai','cowork')}`},
{section:'Deep dive',title:'Pick a model for the job',body:`<p class="lead">Start with the app default. Use lighter models for routine volume and save the highest tier for work that needs more judgement.</p><div class="model-routing"><div class="model-head"><span>Task</span><span>GPT Work</span><span>Claude Cowork</span><span>Start here when…</span></div><div class="model-row"><div class="tier"><b>01</b><strong>Routine volume</strong></div><div class="model-cell gpt"><strong>GPT-6 Luna</strong><small>Simple, repeatable work</small></div><div class="model-cell claude"><strong>Claude Haiku 4.5</strong><small>Fast, high-volume steps</small></div><div class="use-cell">Sorting, extraction and short summaries</div></div><div class="model-row"><div class="tier"><b>02</b><strong>Everyday work</strong></div><div class="model-cell gpt"><strong>GPT-6 Sol</strong><small>General knowledge work</small></div><div class="model-cell claude"><strong>Claude Sonnet 5</strong><small>Speed with strong capability</small></div><div class="use-cell">Drafting, routine analysis and research</div></div><div class="model-row"><div class="tier"><b>03</b><strong>Complex work</strong></div><div class="model-cell gpt"><strong>GPT-6 Sol</strong><small>Raise reasoning if needed</small></div><div class="model-cell claude"><strong>Claude Opus 5.5</strong><small>Anthropic’s general starting point</small></div><div class="use-cell">Longer analysis, hard coding and careful review</div></div><div class="model-row"><div class="tier"><b>04</b><strong>Hard, long-running work</strong></div><div class="model-cell gpt"><strong>GPT-6 Astra</strong><small>Highest capability tier</small></div><div class="model-cell claude"><strong>Claude Fable 5.1</strong><small>Long-horizon agent work</small></div><div class="use-cell">Only when simpler settings miss the quality bar</div></div></div><p class="slide-note"><strong>These are task tiers, not claims that paired models are equivalent.</strong> Names and access vary by plan and workspace. Anthropic recommends Opus 5.5 for most workloads and Fable 5.1 for its hardest long-horizon tasks.</p>${cite('gptModels','openaiModels','claudeModels','claudeChoosing')}`},
{section:'Deep dive',title:'Keep model usage under control',body:`<p class="lead">“Token maxxing” usually means spending more usage than the task needs. These habits help.</p>${cards([['Use the normal setting first','Keep the default model and reasoning effort for routine work. Raise effort after a real miss, not just because the task sounds important.','accent'],['Give it the right-sized context','Attach the few useful files or a short source summary. Don’t paste a whole archive when one brief will do.','teal'],['Set an output limit','Ask for the format and size you need: “one page”, “five bullets” or “only the changed rows”.'],['Step up after a quality check','Try Luna or Haiku for simple repeatable steps. Move up a tier only when a checked sample shows the cheaper route falls short.','amber'],['Use parallel agents sparingly','Extra workers can help on independent tasks, but they also add work and usage. Start with one agent unless parallel work saves time.']])}<p class="slide-note">For subscription tools, usage limits may not map directly to raw token counts. Check your workspace’s model picker and plan limits.</p>${cite('openaiModels','gptModels','claudeChoosing')}`},
{section:'How-to guide',title:'A small pilot, step by step',body:`<p class="lead">Pick one repeatable task, define the output, then compare tools with the same inputs.</p>`,type:'section tealbg'},
{section:'How-to guide',title:'1. Choose one job and one owner',body:`<div class="keyline">Start with a weekly product or research brief that has a clear reviewer and an existing template.</div>${bullets([['Input','A small set of approved notes, test results or research links.'],['Output','One brief with linked evidence, open questions and an owner for each follow-up.'],['Success measure','Compare time to a usable draft, correction count and reviewer effort against the current process.']])}`},
{section:'How-to guide',title:'2. Configure access and context',body:`<div class="sequence"><div class="step"><b>01</b><h3>Choose tenant</h3><p>Use the Breville approved ChatGPT or Claude workspace.</p></div><div class="step"><b>02</b><h3>Set permissions</h3><p>Check Work or Cowork availability and project sharing.</p></div><div class="step"><b>03</b><h3>Add sources</h3><p>Use an approved template, glossary and small input set.</p></div><div class="step"><b>04</b><h3>Name reviewers</h3><p>Decide who checks facts and signs off the deliverable.</p></div></div><p class="slide-note">For ChatGPT, a shared project may disable Work because it uses project-only memory. For Claude, a local-folder project stays on that machine.</p>${cite('openai','projects','claudeProjects')}`},
{section:'How-to guide',title:'3. Run a first Work task',body:`<p class="small">In GPT Work, start in an eligible context and attach the approved inputs. Adapt this prompt:</p><div class="prompt-shell"><button class="copy-prompt" type="button" aria-label="Copy prompt" title="Copy prompt"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>Copy</span></button><div class="prompt">Create a two-page launch readiness brief from the attached approved sources. Use the supplied template. For each factual claim, cite the specific source. Mark missing evidence as “Needs verification”. List decisions for the product owner. Do not send or publish anything. Ask me before changing source files.</div></div><p class="slide-note">If Work is unavailable in the selected project, check its sharing and memory settings; run the task in an eligible private context and share the reviewed output.</p>${cite('openai','projects')}`},
{section:'How-to guide',title:'4. Run the same Cowork task',body:`<p class="small">In Claude Cowork, make a project for the pilot, then add the same approved sources and template:</p><div class="prompt-shell"><button class="copy-prompt" type="button" aria-label="Copy prompt" title="Copy prompt"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>Copy</span></button><div class="prompt">Use only this project’s approved materials to draft the launch readiness brief. Match the attached template. Cite the supporting source beside every factual claim. Put uncertainties in a separate “Needs verification” section. Do not send messages, publish, or change source files without my review.</div></div><p class="slide-note">On Team and Enterprise, invite colleagues to the Cowork project with the appropriate view or edit access. Check whether it is cloud-backed or tied to a local folder.</p>${cite('claudeProjects','cowork')}`},
{section:'How-to guide',title:'5. Review, compare, decide',body:`<table class="matrix"><thead><tr><th>Measure</th><th>How to check</th><th>Decision rule</th></tr></thead><tbody><tr><td>Accuracy</td><td>Spot-check every claim and citation against its source</td><td>Reject unsupported launch claims</td></tr><tr><td>Reviewer time</td><td>Record minutes to make the brief usable</td><td>Count rework, not just generation speed</td></tr><tr><td>Team hand-off</td><td>Ask a second member to find context and continue</td><td>Document what they can actually access</td></tr><tr><td>Repeatability</td><td>Run the same job with a new input set</td><td>Keep the setup only if it saves work twice</td></tr></tbody></table>`},
{section:'How-to guide',title:'A sensible rollout',body:`<div class="sequence"><div class="step"><b>WEEK 1</b><h3>Pilot</h3><p>One owner, one job and a small approved source set.</p></div><div class="step"><b>WEEK 2</b><h3>Review</h3><p>Measure errors, reviewer effort and hand-off friction.</p></div><div class="step"><b>WEEK 3</b><h3>Expand</h3><p>Add two colleagues if the first task is reliable.</p></div><div class="step"><b>WEEK 4</b><h3>Standardise</h3><p>Save the prompt, template, source rules and owner.</p></div></div><p class="slide-note">Proposed rollout, subject to internal permissions and security review.</p>`},
{section:'Reference',title:'Sources and what to verify',body:`<p class="small">Model lineup and product notes checked against official documentation on 23 September 2026. Availability can differ by plan and workspace.</p><ol class="source-list"><li><span>01</span><a href="${SRC.openai}" target="_blank">OpenAI: GPT Work and Codex</a></li><li><span>02</span><a href="${SRC.projects}" target="_blank">OpenAI: Projects in ChatGPT</a></li><li><span>03</span><a href="${SRC.gptModels}" target="_blank">OpenAI: GPT-6 Sol and Luna</a></li><li><span>04</span><a href="${SRC.openaiModels}" target="_blank">OpenAI: GPT-5.6 and GPT-6 Pro in ChatGPT</a></li><li><span>05</span><a href="${SRC.claudeProjects}" target="_blank">Anthropic: Cowork projects</a></li><li><span>06</span><a href="${SRC.cowork}" target="_blank">Anthropic: Cowork on Team and Enterprise</a></li><li><span>07</span><a href="${SRC.claudeModels}" target="_blank">Anthropic: Claude model overview</a></li><li><span>08</span><a href="${SRC.claudeChoosing}" target="_blank">Anthropic: Choosing the right model</a></li></ol><p class="slide-note"><strong>Live check:</strong> In Breville’s workspace, test the exact project-sharing and model options staff can see before circulating instructions.</p>`,type:'top'},
{section:'Reference',title:'Glossary',body:`<table class="matrix glossary-table"><thead><tr><th>Term</th><th>Plain English</th></tr></thead><tbody><tr><td>Agent</td><td>AI that can take several steps towards a goal using tools you allow.</td></tr><tr><td>Project</td><td>A workspace for related files, instructions and chats.</td></tr><tr><td>Shared project</td><td>A project more than one person can access. It does not guarantee that every agent mode works inside it.</td></tr><tr><td>Token</td><td>A small piece of text a model processes. Longer inputs and outputs generally use more tokens.</td></tr><tr><td>Context window</td><td>How much information a model can consider in one task. Bigger does not mean you should attach everything.</td></tr><tr><td>Reasoning effort</td><td>A setting that trades time and usage for more deliberate problem-solving.</td></tr><tr><td>Connector</td><td>A link to another app or data source, limited by the access your account grants.</td></tr><tr><td>Local / cloud</td><td>Local work runs on your computer. Cloud work runs on the provider’s service. File storage depends on the project type.</td></tr></tbody></table>`},
{section:'End',title:'Thanks for joining in.',body:`<p class="lead">Questions or ideas? Reach out to Vivid or Lilly in Slack:</p><div class="contact-channel">#bai-general</div><p class="slide-note">Bring a real task. We can help you pick the right tool, model and starting point.</p>`,type:'section warmbg'},
];
const deck=document.getElementById('deck'),overview=document.getElementById('overview'),indexGrid=document.getElementById('indexGrid');
slides.forEach((s,i)=>{let e=document.createElement('section');e.className=`slide ${s.type||''}`;e.id=`slide-${i+1}`;e.setAttribute('aria-label',`Slide ${i+1}: ${s.title}`);e.setAttribute('aria-hidden','true');e.innerHTML=`<div class="slide-inner"><p class="eyebrow">${s.section} <span style="opacity:.5;margin:0 8px">/</span> ${String(i+1).padStart(2,'0')}</p>${s.type==='section'?`<div class="section-num">${String(i+1).padStart(2,'0')}</div>`:''}<${i===0?'h1':'h2'}>${s.title}</${i===0?'h1':'h2'}>${s.body}</div>`;deck.appendChild(e);let b=document.createElement('button');b.className='index-item';b.innerHTML=`<small>${String(i+1).padStart(2,'0')} / ${s.section}</small><strong>${s.title}</strong>`;b.onclick=()=>{show(i);toggleOverview(false)};indexGrid.appendChild(b)});
let current=0;const slideEls=[...deck.children],idxEls=[...indexGrid.children];function show(i){current=Math.min(Math.max(i,0),slides.length-1);slideEls.forEach((e,n)=>{e.classList.toggle('active',n===current);e.setAttribute('aria-hidden',n!==current);if(n===current)e.scrollTop=0});idxEls.forEach((e,n)=>e.classList.toggle('current',n===current));document.getElementById('count').textContent=`${current+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;history.replaceState(null,'',`#${current+1}`);document.title=`${slides[current].title} | Work vs Cowork`}
function toggleOverview(force){let open=force??!overview.classList.contains('open');overview.classList.toggle('open',open);if(open){idxEls[current].scrollIntoView({block:'nearest'});document.getElementById('closeOverview').focus()}else document.getElementById('overviewBtn').focus()}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('overviewBtn').onclick=()=>toggleOverview(true);document.getElementById('closeOverview').onclick=()=>toggleOverview(false);document.getElementById('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('keydown',e=>{if(e.target.closest('a,button')&&['ArrowRight','ArrowLeft',' '].includes(e.key))return;if(e.key==='Escape'){toggleOverview(false);return}if(e.key.toLowerCase()==='o'){toggleOverview();return}if(e.key.toLowerCase()==='f'){document.getElementById('fullBtn').click();return}if(overview.classList.contains('open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
let startX=0;deck.addEventListener('touchstart',e=>startX=e.changedTouches[0].screenX,{passive:true});deck.addEventListener('touchend',e=>{let diff=e.changedTouches[0].screenX-startX;if(Math.abs(diff)>70)show(current+(diff<0?1:-1))},{passive:true});window.addEventListener('hashchange',()=>{let n=Number(location.hash.slice(1));if(n>=1&&n<=slides.length&&n-1!==current)show(n-1)});show(Number(location.hash.slice(1))?Number(location.hash.slice(1))-1:0);
document.querySelectorAll('.copy-prompt').forEach(button=>button.addEventListener('click',async()=>{const content=button.nextElementSibling.innerText;const done=()=>{button.classList.add('copied');button.querySelector('span').textContent='Copied';button.setAttribute('aria-label','Prompt copied');setTimeout(()=>{button.classList.remove('copied');button.querySelector('span').textContent='Copy';button.setAttribute('aria-label','Copy prompt')},1800)};try{await navigator.clipboard.writeText(content)}catch(error){const area=document.createElement('textarea');area.value=content;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}done()}));
</script>
